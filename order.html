<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaSMM - Orders</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">
<h2>🚀 NovaSMM</h2>

<a href="dashboard.html">🏠 Dashboard</a>
<a href="services.html">📦 Services</a>
<a href="orders.html">🛒 Orders</a>
<a href="users.html">👥 Users</a>
<a href="wallet.html">💰 Wallet</a>
<a href="payments.html">💳 Payments</a>
<a href="providers.html">🔌 Providers</a>
<a href="tickets.html">🎫 Tickets</a>
<a href="reports.html">📊 Reports</a>
<a href="settings.html">⚙️ Settings</a>
</div>

<div class="main-content">

<h1>🛒 Orders Management</h1>

<div class="top-bar">

<input
type="text"
id="searchOrder"
placeholder="🔍 Search Order"
onkeyup="searchOrder()">

<button onclick="openOrderForm()">
➕ Add Order
</button>

</div>
<div id="orderForm" style="display:none;background:#1f2937;padding:15px;border-radius:10px;margin-top:15px;">

<h3>➕ Add New Order</h3>

<select id="orderUser" style="width:100%;margin:8px 0;padding:10px;">
<option value="">Select User</option>
</select>

<select id="orderService" style="width:100%;margin:8px 0;padding:10px;">
<option value="">Select Service</option>
</select>

<input
type="number"
id="orderQuantity"
placeholder="Quantity"
style="width:100%;margin:8px 0;padding:10px;">

<input
type="text"
id="orderPrice"
placeholder="Price"
readonly
style="width:100%;margin:8px 0;padding:10px;">

<button onclick="saveOrder()">
💾 Save Order
</button>

<button onclick="closeOrderForm()">
❌ Cancel
</button>

</div>
<br>

<table id="ordersTable">

<thead>

<tr>
<th>Order ID</th>
<th>User</th>
<th>Service</th>
<th>Qty</th>
<th>Price</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<script type="module" src="orders.js"></script>

</body>
</html>
