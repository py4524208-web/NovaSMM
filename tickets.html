<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaSMM - Tickets</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="sidebar">

<h2>🚀 NovaSMM</h2>

<a href="dashboard.html">🏠 Dashboard</a>
<a href="services.html">📦 Services</a>
<a href="orders.html">🛒 Orders</a>
<a href="users.html">👥 Users</a>
<a href="wallet.html">💰 Wallet</a>
<a href="payments.html">💳 Payments</a>
<a href="providers.html">🔌 Providers</a>
<a href="tickets.html" class="active">🎫 Tickets</a>
<a href="reports.html">📊 Reports</a>
<a href="settings.html">⚙️ Settings</a>

</div>

<div class="main-content">

<h1>🎫 Support Tickets</h1>

<input
type="text"
id="searchTicket"
placeholder="🔍 Search Ticket..."
onkeyup="searchTicket()">

<br><br>

<div class="card">

<select id="ticketUser">

<option value="">Select User</option>

</select>

<input
type="text"
id="ticketSubject"
placeholder="Ticket Subject">

<textarea
id="ticketMessage"
placeholder="Ticket Message"
rows="5"></textarea>

<select id="ticketStatus">

<option value="Open">
🟢 Open
</option>

<option value="Pending">
🟡 Pending
</option>

<option value="Closed">
🔴 Closed
</option>

</select>

<button onclick="saveTicket()">

🎫 Save Ticket

</button>

</div>

<br>

<table id="ticketsTable">

<tr>

<th>Ticket ID</th>

<th>User</th>

<th>Subject</th>

<th>Status</th>

<th>Date</th>

<th>Action</th>

</tr>

</table>

</div>

<script type="module" src="tickets.js"></script>
<script type="module" src="security.js"></script>

</body>
</html>
