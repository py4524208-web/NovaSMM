<h1>💰 Wallet Management</h1>

<input
type="text"
id="walletUser"
placeholder="User Name">

<input
type="number"
id="walletAmount"
placeholder="Amount">

<select id="walletType">
<option value="Add">➕ Add Balance</option>
<option value="Remove">➖ Remove Balance</option>
</select>

<button onclick="updateWallet()">
💰 Update Wallet
</button>

<br><br>

<table id="walletTable" border="1" width="100%">

<tr>
<th>User</th>
<th>Balance</th>
<th>Action</th>
</tr>

</table>
