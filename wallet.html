<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaSMM - Wallet</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="sidebar">

<h2>🚀 NovaSMM</h2>

<a href="dashboard.html">🏠 Dashboard</a>
<a href="services.html">📦 Services</a>
<a href="orders.html">🛒 Orders</a>
<a href="users.html">👥 Users</a>
<a href="wallet.html" class="active">💰 Wallet</a>
<a href="payments.html">💳 Payments</a>

<a href="settings.html">⚙️ Settings</a>

</div>

<div class="main-content">

<h1>💰 Wallet Management</h1>

<input
type="text"
id="searchWallet"
placeholder="🔍 Search User..."
onkeyup="searchWallet()">

<br><br>

<div class="card">

<select id="walletUser">

<option value="">Select User</option>

</select>

<input
type="number"
id="walletAmount"
placeholder="Amount">

<select id="walletType">

<option value="Add">
➕ Add Balance
</option>

<option value="Deduct">
➖ Deduct Balance
</option>

</select>

<input
type="text"
id="walletRemark"
placeholder="Remark">

<button onclick="saveWallet()">

💾 Save

</button>

</div>

<br>

<table id="walletTable">

<tr>

<th>User</th>

<th>Balance</th>

<th>Last Transaction</th>

<th>Remark</th>

<th>Action</th>

</tr>

</table>

</div>

<script type="module" src="wallet.js"></script>
<script type="module" src="security.js"></script>

</body>
</html>
