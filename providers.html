<div class="main-content">

<h1>🔌 Providers Management</h1>

<div class="card">

<input
type="text"
id="providerName"
placeholder="Provider Name">

<input
type="text"
id="providerApi"
placeholder="API URL">

<input
type="text"
id="providerKey"
placeholder="API Key">

<select id="providerStatus">

<option value="Active">🟢 Active</option>

<option value="Inactive">🔴 Inactive</option>

</select>

<button onclick="addProvider()">

➕ Add Provider

</button>

</div>

<br>

<input
type="text"
id="searchProvider"
placeholder="🔍 Search Provider..."
onkeyup="searchProvider()">

<br><br>

<div class="table-container">

<table id="providerTable">

<tr>

<th>Name</th>

<th>API URL</th>

<th>API Key</th>

<th>Status</th>

<th>Action</th>

</tr>

</table>

</div>

</div>

<script type="module" src="providers.js"></script>
<script type="module" src="security.js"></script>

</body>
