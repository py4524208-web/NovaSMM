<h1>🔌 Providers Management</h1>

<input
type="text"
id="providerName"
placeholder="Provider Name">

<input
type="text"
id="providerApi"
placeholder="API URL">

<input
type="text"
id="providerKey"
placeholder="API Key">

<select id="providerStatus">
<option value="Active">Active</option>
<option value="Inactive">Inactive</option>
</select>

<button onclick="addProvider()">
➕ Add Provider
</button>

<br><br>

<table id="providerTable">

<tr>
<th>Name</th>
<th>API URL</th>
<th>API Key</th>
<th>Status</th>
<th>Action</th>
</tr>

</table>
