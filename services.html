<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaSMM - Services</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="sidebar">

<h2>🚀 NovaSMM</h2>

<a href="dashboard.html">🏠 Dashboard</a>
<a href="services.html" class="active">📦 Services</a>
<a href="orders.html">🛒 Orders</a>
<a href="users.html">👥 Users</a>
<a href="wallet.html">💰 Wallet</a>
<a href="payments.html">💳 Payments</a>
<a href="providers.html">🔌 Providers</a>
<a href="tickets.html">🎫 Tickets</a>
<a href="reports.html">📊 Reports</a>
<a href="settings.html">⚙️ Settings</a>

</div>

<div class="main-content">

<h1>📦 Services Management</h1>

<input
type="text"
id="searchService"
placeholder="🔍 Search Service..."
onkeyup="searchService()">

<br><br>

<div class="card">

<input
type="text"
id="serviceName"
placeholder="Service Name">

<input
type="number"
id="servicePrice"
placeholder="Price">

<input
type="number"
id="serviceMin"
placeholder="Minimum">

<input
type="number"
id="serviceMax"
placeholder="Maximum">

<select id="serviceProvider">

<option value="">
Select Provider
</option>

</select>

<select id="serviceStatus">

<option value="Active">
🟢 Active
</option>

<option value="Inactive">
🔴 Inactive
</option>

</select>

<button onclick="addService()">

➕ Add Service

</button>

</div>

<br>

<table id="serviceTable">

<tr>

<th>ID</th>

<th>Service</th>

<th>Price</th>

<th>Min</th>

<th>Max</th>

<th>Provider</th>

<th>Status</th>

<th>Action</th>

</tr>

</table>

</div>

<script type="module" src="services.js"></script>
<script type="module" src="security.js"></script>

</body>
</html>
