<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaSMM Customer Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="sidebar">

<h2>🚀 NovaSMM</h2>

<a href="customer-dashboard.html" class="active">🏠 Dashboard</a>
<a href="customer-services.html">📦 Services</a>
<a href="customer-orders.html">🛒 Orders</a>
<a href="customer-wallet.html">💰 Wallet</a>
<a href="customer-tickets.html">🎫 Tickets</a>
<button id="logoutBtn">🚪 Logout</button>

</div>

<div class="main-content">

<h1>Welcome 👋</h1>

<div class="dashboard-grid">

<div class="card">
<h3>💰 Wallet Balance</h3>
<h2 id="walletBalance">₹0</h2>
</div>

<div class="card">
<h3>📦 Total Orders</h3>
<h2 id="totalOrders">0</h2>
</div>

<div class="card">
<h3>⏳ Pending Orders</h3>
<h2 id="pendingOrders">0</h2>
</div>

<div class="card">
<h3>✅ Completed Orders</h3>
<h2 id="completedOrders">0</h2>
</div>

</div>

<br>

<div class="card">

<h2>📦 Recent Orders</h2>

<table id="recentOrders">

<tr>

<th>Service</th>

<th>Link</th>

<th>Status</th>

<th>Quantity</th>

</tr>

</table>

</div>

</div>

<script type="module" src="customer-dashboard.js"></script>
<script type="module" src="security.js"></script>

</body>
</html>
