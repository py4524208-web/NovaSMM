</head>

<div class="sidebar">

<div class="main-content">

<h1>👥 Users Management</h1>

<input
type="text"
id="searchUser"
placeholder="🔍 Search User"
onkeyup="searchUser()">

<br><br>

<input
type="text"
id="userName"
placeholder="Full Name">

<input
type="email"
id="userEmail"
placeholder="Email">

<input
type="number"
id="userBalance"
placeholder="Wallet Balance">

<button onclick="addUser()">
➕ Add User
</button>

<br><br>

<table id="usersTable" border="1" width="100%">

<tr>
<th>Name</th>
<th>Email</th>
<th>Wallet</th>
<th>Status</th>
<th>Action</th>
</tr>

</table>

</div>

<script type="module" src="users.js"></script>

</body>
